<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle · Shane's Auto Sales</title>
  <meta name="description" content="Vehicle details at Shane's Auto Sales, Sherman Oaks.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="content" class="wrap">
    <p class="page-hero" style="padding-bottom:12px">
      <a href="inventory.html" class="muted">← <span data-en>Back to inventory</span><span data-es>Volver al inventario</span></a>
    </p>
    <div class="detail">
      <div id="vehicle-root"></div>
      <aside class="buy-card">
        <p class="kicker" data-i18n="estimator">Payment sketch</p>
        <p class="price" id="detail-price"></p>
        <div class="range-row">
          <label class="field"><span data-i18n="down">Down payment</span>
            <input id="est-down" type="range" min="0" step="250">
            <span id="est-down-val"></span>
          </label>
          <label class="field"><span data-i18n="term">Term</span>
            <select id="est-term">
              <option value="36">36</option>
              <option value="48">48</option>
              <option value="60" selected>60</option>
              <option value="72">72</option>
            </select>
          </label>
          <label class="field"><span data-i18n="rate">APR %</span>
            <input id="est-rate" type="number" min="0" max="29.9" step="0.1" value="8.9">
          </label>
        </div>
        <p><span class="est-pay" id="est-pay"></span> <span class="muted" data-i18n="perMonth">/mo est.</span></p>
        <p class="muted" style="font-size:0.82rem;margin:8px 0 0" data-i18n="estimateNote"></p>
        <div class="actions">
          <a class="btn btn-copper" id="apply-link" href="financing.html" data-i18n="apply">Apply</a>
          <a class="btn btn-ghost" href="tel:+18184519099" data-i18n="callAbout">Call</a>
          <a class="btn btn-ghost" id="want-link" href="request.html" data-i18n="wantThis">I want this car</a>
        </div>
      </aside>
    </div>
    <div style="padding-bottom:80px">
      <h2 data-i18n="similar">More on the lot</h2>
      <div class="grid-3" id="similar-grid" style="margin-top:18px"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    ShaneApp.renderHeader("inventory");
    ShaneApp.renderFooter();
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = ShaneApp.t(el.getAttribute("data-i18n"));
    });
  </script>
  <script src="js/vehicle.js"></script>
</body>
</html>
